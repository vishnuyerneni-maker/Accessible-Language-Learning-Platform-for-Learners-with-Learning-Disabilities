<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Player - AccessLearn</title>
    <link rel="stylesheet" href="style-kids.css">
    <link rel="stylesheet" href="animations.css">
    <style>
        /* Lesson Player Specific Styles */
        .lesson-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 0;
            min-height: 100vh;
            background: var(--gradient-mesh), #f8fafc;
        }
        
        /* Sidebar with Lessons List */
        .lessons-sidebar {
            background: white;
            border-right: 1px solid rgba(0,0,0,0.08);
            padding: 25px 0;
            overflow-y: auto;
            max-height: 100vh;
            position: sticky;
            top: 0;
        }
        
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        
        .course-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--gradient-galaxy);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        
        .lesson-item:hover {
            background: rgba(139, 92, 246, 0.08);
        }
        
        .lesson-item.active {
            background: rgba(139, 92, 246, 0.12);
            border-left-color: var(--primary-purple);
        }
        
        .lesson-item.completed .lesson-number {
            background: var(--gradient-forest);
        }
        
        .lesson-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .lesson-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-galaxy);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .lesson-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
            color: var(--text-dark);
        }
        
        .lesson-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        /* Main Content Area */
        .lesson-main {
            padding: 30px 40px;
            overflow-y: auto;
        }
        
        /* Video Player Section */
        .video-container {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            position: relative;
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        
        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .play-button {
            width: 100px;
            height: 100px;
            background: var(--gradient-sunrise);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.4);
            animation: pulse 2s infinite;
        }
        
        .play-button:hover {
            transform: scale(1.1);
        }
        
        /* Lesson Content Card */
        .lesson-content-card {
            background: white;
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
        }
        
        .lesson-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .lesson-title-section h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            font-family: var(--font-display);
            color: var(--text-dark);
        }
        
        .lesson-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        
        /* Assistive Tools */
        .assistive-tools {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .tool-btn {
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tool-btn-primary {
            background: var(--gradient-sunrise);
            color: white;
        }
        
        .tool-btn-secondary {
            background: rgba(139, 92, 246, 0.1);
            color: var(--primary-purple);
            border-color: var(--primary-purple);
        }
        
        .tool-btn:hover {
            transform: scale(1.05);
        }
        
        /* Lesson Text Content */
        .lesson-text {
            font-size: 1.2rem;
            line-height: 2;
            color: var(--text-medium);
        }
        
        .lesson-text p {
            margin-bottom: 20px;
        }
        
        .lesson-text .highlight {
            background: linear-gradient(120deg, #ffd93d40 0%, #ffd93d40 100%);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .lesson-text .key-word {
            color: var(--primary-purple);
            font-weight: 700;
            cursor: pointer;
            border-bottom: 2px dashed var(--primary-purple);
        }
        
        /* Interactive Practice Section */
        .practice-section {
            background: var(--gradient-candy);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            color: white;
        }
        
        .practice-section h3 {
            margin: 0 0 15px 0;
            font-family: var(--font-display);
            font-size: 1.5rem;
        }
        
        /* Navigation Footer */
        .lesson-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-top: 1px solid rgba(0,0,0,0.08);
            margin-top: 30px;
        }
        
        .nav-btn {
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
        }
        
        .nav-btn-prev {
            background: rgba(0,0,0,0.05);
            color: var(--text-medium);
        }
        
        .nav-btn-next {
            background: var(--gradient-galaxy);
            color: white;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }
        
        .nav-btn:hover:not(:disabled) {
            transform: translateY(-3px);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Progress Bar */
        .progress-bar-container {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: var(--gradient-sunrise);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        /* Mobile Responsive */
        @media (max-width: 900px) {
            .lesson-container {
                grid-template-columns: 1fr;
            }
            
            .lessons-sidebar {
                display: none;
            }
            
            .lesson-main {
                padding: 20px;
            }
            
            .lesson-content-card {
                padding: 25px;
            }
            
            .lesson-title-section h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="lesson-container">
        <!-- Sidebar with Lessons -->
        <aside class="lessons-sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-weight: 500; margin-bottom: 15px;">
                    <span>←</span> Back to Dashboard
                </a>
                <div class="course-badge" id="course-badge">
                    <span>🧠</span> <span id="course-category">Loading...</span>
                </div>
                <h2 id="course-title" style="margin: 0; font-size: 1.3rem; color: var(--text-dark);">Loading Course...</h2>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="course-progress" style="width: 0%;"></div>
                </div>
                <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);"><span id="progress-text">0%</span> Complete</p>
            </div>
            
            <!-- Lessons List -->
            <nav id="lessons-list">
                <!-- Lessons will be injected here -->
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="lesson-main">
            <!-- Video Section -->
            <div class="video-container animate-scale-in" id="video-container">
                <div class="video-wrapper">
                    <div class="video-placeholder" id="video-placeholder">
                        <div class="play-button" onclick="playVideo()">▶</div>
                        <p style="margin-top: 20px; font-size: 1.1rem; opacity: 0.8;">Click to play lesson video</p>
                    </div>
                    <iframe id="video-frame" style="display: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
            
            <!-- Lesson Content -->
            <div class="lesson-content-card animate-fade-in">
                <div class="lesson-header">
                    <div class="lesson-title-section">
                        <h1 id="lesson-title">Loading Lesson...</h1>
                        <div class="lesson-meta">
                            <div class="meta-item">
                                <span>📚</span> <span id="lesson-module">Module 1</span>
                            </div>
                            <div class="meta-item">
                                <span>⏱️</span> <span id="lesson-duration">5 min</span>
                            </div>
                            <div class="meta-item">
                                <span>🎯</span> <span id="lesson-type">Video Lesson</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="assistive-tools">
                        <button class="tool-btn tool-btn-primary" onclick="speakLesson()">
                            🔊 Read Aloud
                        </button>
                        <button class="tool-btn tool-btn-secondary" onclick="toggleDyslexiaFont()">
                            👁️ Dyslexia Font
                        </button>
                        <button class="tool-btn tool-btn-secondary" onclick="increaseFontSize()">
                            A+ Larger
                        </button>
                    </div>
                </div>
                
                <!-- Lesson Text Content -->
                <div class="lesson-text" id="lesson-content">
                    <p>Loading lesson content...</p>
                </div>
                
                <!-- Interactive Practice -->
                <div class="practice-section" id="practice-section" style="display: none;">
                    <h3>🎮 Quick Practice!</h3>
                    <p id="practice-prompt">Practice what you've learned</p>
                    <div id="practice-content"></div>
                </div>
                
                <!-- Navigation -->
                <div class="lesson-nav">
                    <button class="nav-btn nav-btn-prev" id="prev-btn" onclick="previousLesson()">
                        ← Previous Lesson
                    </button>
                    <button class="nav-btn nav-btn-next" id="next-btn" onclick="nextLesson()">
                        Next Lesson →
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" style="display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--gradient-galaxy); color: white; padding: 15px 30px; border-radius: 30px; font-weight: 600; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 1000;"></div>

    <script src="script.js"></script>
    <script>
        // Course and Lesson Data
        const courseLessons = {
            // ===== DYSLEXIA COURSES =====
            'dyslexia_101': {
                title: 'Letter Recognition Fun',
                category: 'Dyslexia',
                color: '#FF6B35',
                lessons: [
                    {
                        id: 1,
                        title: 'Meet the Alphabet!',
                        duration: '6 min',
                        type: 'Video Lesson',
                        videoId: 'hq3yfQnllfQ', // ABC Song for Kids
                        content: `
                            <p>Welcome to your first adventure in letter land! 🎉</p>
                            <p>The alphabet has <span class="highlight">26 letters</span> - from A to Z. Each letter has its own special shape and sound.</p>
                            <p>Today we'll learn to recognize letters by their <span class="key-word">shapes</span>. Some letters look similar, like:</p>
                            <ul style="margin: 20px 0; padding-left: 30px;">
                                <li><strong>b</strong> and <strong>d</strong> - they're like mirror images!</li>
                                <li><strong>p</strong> and <strong>q</strong> - they flip around too!</li>
                                <li><strong>m</strong> and <strong>w</strong> - one is upside down!</li>
                            </ul>
                            <p>Don't worry if you mix them up sometimes - even grown-ups do! We'll practice together. 💪</p>
                        `,
                        practice: {
                            type: 'matching',
                            prompt: 'Can you find the letter B?',
                            options: ['b', 'd', 'p', 'B'],
                            correct: 3
                        }
                    },
                    {
                        id: 2,
                        title: 'Letter Shapes: Circles & Lines',
                        duration: '5 min',
                        type: 'Interactive',
                        videoId: 'ezTdYBmMpqQ',
                        content: `
                            <p>Letters are made of simple shapes! Let's discover them together! 🔵📏</p>
                            <p><span class="highlight">Circle letters:</span> O, C, G, Q - they have round parts</p>
                            <p><span class="highlight">Line letters:</span> I, L, T, E, F, H - they use straight lines</p>
                            <p><span class="highlight">Mixed letters:</span> B, D, P, R - they use both circles AND lines!</p>
                            <p>When you write, think about:</p>
                            <ul style="margin: 20px 0; padding-left: 30px;">
                                <li>Does this letter have a <span class="key-word">circle</span>?</li>
                                <li>Does it have <span class="key-word">straight lines</span>?</li>
                                <li>Which direction does the circle face?</li>
                            </ul>
                        `,
                        practice: {
                            type: 'category',
                            prompt: 'Which letter has a circle in it?',
                            options: ['L', 'T', 'O', 'I'],
                            correct: 2
                        }
                    },
                    {
                        id: 3,
                        title: 'Uppercase vs Lowercase',
                        duration: '7 min',
                        type: 'Video Lesson',
                        videoId: '5PmB3sIuO4Y',
                        content: `
                            <p>Every letter has TWO versions - like a big sibling and little sibling! 👫</p>
                            <p><span class="highlight">UPPERCASE</span> (Capital) letters are BIG and TALL: A B C D E</p>
                            <p><span class="highlight">lowercase</span> letters are smaller: a b c d e</p>
                            <p>We use UPPERCASE letters for:</p>
                            <ul style="margin: 20px 0; padding-left: 30px;">
                                <li>The <span class="key-word">first letter</span> of a sentence</li>
                                <li>Names of people: <strong>S</strong>arah, <strong>M</strong>ohamed</li>
                                <li>Names of places: <strong>I</strong>ndia, <strong>L</strong>ondon</li>
                            </ul>
                            <p>Most of the time, we use lowercase letters when writing. 📝</p>
                        `,
                        practice: {
                            type: 'matching',
                            prompt: 'Which is the UPPERCASE letter?',
                            options: ['a', 'A', 'b', 'c'],
                            correct: 1
                        }
                    },
                    {
                        id: 4,
                        title: 'Tricky Letter Pairs: b and d',
                        duration: '8 min',
                        type: 'Interactive',
                        videoId: 'XF7RqU3pjJI',
                        content: `
                            <p>Let's tackle the MOST confusing letters: <span class="highlight">b</span> and <span class="highlight">d</span>! 🤔</p>
                            <p>Here's a super helpful trick called the <span class="key-word">"bed" trick</span>:</p>
                            <div style="background: #f0f9ff; padding: 20px; border-radius: 15px; margin: 20px 0; text-align: center;">
                                <p style="font-size: 3rem; margin: 0; font-family: monospace;">b e d</p>
                                <p style="margin: 10px 0 0 0;">Make fists with your thumbs up - left hand is 'b', right hand is 'd'!</p>
                            </div>
                            <p>Another trick: <strong>b</strong> has its belly in <strong>front</strong> (→), <strong>d</strong> has its belly in <strong>back</strong> (←)</p>
                            <p>Practice writing both letters while saying: "b faces right, d faces left!" 👍</p>
                        `,
                        practice: {
                            type: 'identify',
                            prompt: 'Which letter faces RIGHT (belly forward)?',
                            options: ['b', 'd'],
                            correct: 0
                        }
                    },
                    {
                        id: 5,
                        title: 'Letter Recognition Game',
                        duration: '10 min',
                        type: 'Game',
                        videoId: 'BELlZKpi1Zs',
                        content: `
                            <p>Time to play and practice everything we learned! 🎮🎉</p>
                            <p>In this final lesson, we'll play games to recognize letters super fast!</p>
                            <p><span class="highlight">What you've learned:</span></p>
                            <ul style="margin: 20px 0; padding-left: 30px;">
                                <li>✅ All 26 letters of the alphabet</li>
                                <li>✅ Letters are made of circles and lines</li>
                                <li>✅ Uppercase (BIG) vs lowercase (small)</li>
                                <li>✅ The "bed" trick for b and d</li>
                            </ul>
                            <p>You're becoming a letter expert! Ready for the quiz? 🌟</p>
                        `,
                        practice: {
                            type: 'quiz',
                            prompt: 'Ready to take the quiz and earn your badge?'
                        }
                    }
                ]
            },
            'dyslexia_102': {
                title: 'Phonics Adventures',
                category: 'Dyslexia',
                color: '#8B5CF6',
                lessons: [
                    {
                        id: 1,
                        title: 'What Are Letter Sounds?',
                        duration: '5 min',
                        type: 'Video Lesson',
                        videoId: 'BELlZKpi1Zs',
                        content: `
                            <p>Every letter makes a special <span class="highlight">sound</span>! 🔊</p>
                            <p>This is called <span class="key-word">phonics</span> - connecting letters to their sounds.</p>
                            <p>For example:</p>
                            <ul style="margin: 20px 0; padding-left: 30px;">
                                <li><strong>A</strong> says "ah" like in <em>apple</em> 🍎</li>
                                <li><strong>B</strong> says "buh" like in <em>ball</em> ⚽</li>
                                <li><strong>C</strong> says "cuh" like in <em>cat</em> 🐱</li>
                            </ul>
                            <p>When we know the sounds, we can READ words by sounding them out! 📖</p>
                        `,
                        practice: {
                            type: 'sound',
                            prompt: 'What sound does "S" make?',
                            options: ['sss', 'zzz', 'mmm', 'fff'],
                            correct: 0
                        }
                    },
                    {
                        id: 2,
                        title: 'Short Vowel Sounds',
                        duration: '7 min',
                        type: 'Video Lesson',
                        videoId: 'd_mLFHLSULw',
                        content: `
                            <p>Meet the <span class="highlight">vowels</span>: A, E, I, O, U! 🌟</p>
                            <p>These 5 letters are SUPER special - every word needs at least one vowel!</p>
                            <p><span class="key-word">Short vowel sounds:</span></p>
                            <ul style="margin: 20px 0; padding-left: 30px;">
                                <li><strong>A</strong> - "a" as in <em>cat</em> 🐱</li>
                                <li><strong>E</strong> - "e" as in <em>bed</em> 🛏️</li>
                                <li><strong>I</strong> - "i" as in <em>pig</em> 🐷</li>
                                <li><strong>O</strong> - "o" as in <em>hot</em> 🔥</li>
                                <li><strong>U</strong> - "u" as in <em>cup</em> ☕</li>
                            </ul>
                            <p>Try saying each sound out loud! 🗣️</p>
                        `,
                        practice: {
                            type: 'matching',
                            prompt: 'Which word has the short "a" sound?',
                            options: ['cake', 'cat', 'car', 'call'],
                            correct: 1
                        }
                    },
                    {
                        id: 3,
                        title: 'Consonant Sounds',
                        duration: '6 min',
                        type: 'Interactive',
                        videoId: 'jvAYUvQUrGo',
                        content: `
                            <p>All the other letters are called <span class="highlight">consonants</span>! 📝</p>
                            <p>B, C, D, F, G, H, J, K, L, M, N, P, Q, R, S, T, V, W, X, Y, Z</p>
                            <p>Some consonants sound similar:</p>
                            <ul style="margin: 20px 0; padding-left: 30px;">
                                <li><strong>B</strong> and <strong>P</strong> - both use your lips 👄</li>
                                <li><strong>D</strong> and <strong>T</strong> - both use your tongue 👅</li>
                                <li><strong>F</strong> and <strong>V</strong> - teeth on lip sounds 🦷</li>
                            </ul>
                            <p>Feel your mouth as you make each sound - it helps you remember! 🧠</p>
                        `,
                        practice: {
                            type: 'sound',
                            prompt: 'Which sound uses your lips together?',
                            options: ['S', 'B', 'H', 'L'],
                            correct: 1
                        }
                    },
                    {
                        id: 4,
                        title: 'Blending Sounds Together',
                        duration: '8 min',
                        type: 'Video Lesson',
                        videoId: 'si_UJ_TafmA',
                        content: `
                            <p>Now for the magic part - <span class="highlight">blending</span>! ✨</p>
                            <p>Blending means connecting sounds smoothly to make words.</p>
                            <p>Let's try with the word <span class="key-word">CAT</span>:</p>
                            <div style="background: #f0f9ff; padding: 20px; border-radius: 15px; margin: 20px 0; text-align: center;">
                                <p style="font-size: 2rem; margin: 0;">C - A - T</p>
                                <p style="margin: 10px 0 0 0;">"cuh" + "a" + "tuh" = CAT! 🐱</p>
                            </div>
                            <p>Tips for blending:</p>
                            <ul style="margin: 20px 0; padding-left: 30px;">
                                <li>Say each sound slowly first</li>
                                <li>Then say them faster and faster</li>
                                <li>Until they become one word!</li>
                            </ul>
                        `,
                        practice: {
                            type: 'blend',
                            prompt: 'Blend these sounds: D - O - G',
                            options: ['dig', 'dog', 'dug', 'dag'],
                            correct: 1
                        }
                    },
                    {
                        id: 5,
                        title: 'Reading CVC Words',
                        duration: '7 min',
                        type: 'Interactive',
                        videoId: 'eFQd8fbMD4E',
                        content: `
                            <p><span class="highlight">CVC words</span> are Consonant-Vowel-Consonant words! 📚</p>
                            <p>These are the easiest words to read and spell.</p>
                            <p>Examples of CVC words:</p>
                            <ul style="margin: 20px 0; padding-left: 30px;">

                        practice: {

        // Current state
        let currentCourse = null;
        let currentLessonIndex = 0;
        let completedLessons = [];
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Get course ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course') || 'dyslexia_101';
            
            loadCourse(courseId);
        });
        
        function loadCourse(courseId) {
            currentCourse = courseLessons[courseId] || courseLessons['dyslexia_101'];
            
            // Load saved progress
            const savedProgress = localStorage.getItem(`course_${courseId}_completed`);
            completedLessons = savedProgress ? JSON.parse(savedProgress) : [];
            
            // Update UI
            document.getElementById('course-title').textContent = currentCourse.title;
            document.getElementById('course-category').textContent = currentCourse.category;
            document.getElementById('course-badge').style.background = currentCourse.color;
            
            // Render lessons list
            renderLessonsList();
            
            // Load first lesson
            loadLesson(0);
            
            updateProgress();
        }
        
        function renderLessonsList() {
            const list = document.getElementById('lessons-list');
            list.innerHTML = '';
            
            currentCourse.lessons.forEach((lesson, index) => {
                const isCompleted = completedLessons.includes(lesson.id);
                const isLocked = index > 0 && !completedLessons.includes(currentCourse.lessons[index - 1].id);
                const isActive = index === currentLessonIndex;
                
                const item = document.createElement('div');
                item.className = `lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''}`;
                item.onclick = () => !isLocked && loadLesson(index);
                
                item.innerHTML = `
                    <div class="lesson-number" style="${isCompleted ? 'background: var(--gradient-forest);' : ''}">
                        ${isCompleted ? '✓' : (isLocked ? '🔒' : lesson.id)}
                    </div>
                    <div class="lesson-info">
                        <h4>${lesson.title}</h4>
                        <span>${lesson.duration} • ${lesson.type}</span>
                    </div>
                `;
                
                list.appendChild(item);
            });
        }
        
        function loadLesson(index) {
            currentLessonIndex = index;
            const lesson = currentCourse.lessons[index];
            
            // Update active state in sidebar
            document.querySelectorAll('.lesson-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            
            // Update lesson content
            document.getElementById('lesson-title').textContent = lesson.title;
            document.getElementById('lesson-module').textContent = `Lesson ${lesson.id} of ${currentCourse.lessons.length}`;
            document.getElementById('lesson-duration').textContent = lesson.duration;
            document.getElementById('lesson-type').textContent = lesson.type;
            document.getElementById('lesson-content').innerHTML = lesson.content;
            
            // Update video
            if (lesson.videoId) {
                document.getElementById('video-frame').src = `https://www.youtube.com/embed/${lesson.videoId}?rel=0`;
                document.getElementById('video-placeholder').style.display = 'flex';
                document.getElementById('video-frame').style.display = 'none';
            }
            
            // Update navigation buttons
            document.getElementById('prev-btn').disabled = index === 0;
            const nextBtn = document.getElementById('next-btn');
            if (index === currentCourse.lessons.length - 1) {
                nextBtn.textContent = '🏆 Complete & Take Quiz →';
                nextBtn.onclick = () => goToQuiz();
            } else {
                nextBtn.textContent = 'Next Lesson →';
                nextBtn.onclick = () => nextLesson();
            }
            
            // Setup practice section
            if (lesson.practice) {
                setupPractice(lesson.practice);
            }
            
            // Scroll to top
            document.querySelector('.lesson-main').scrollTop = 0;
        }
        
        function playVideo() {
            document.getElementById('video-placeholder').style.display = 'none';
            const frame = document.getElementById('video-frame');
            frame.style.display = 'block';
            frame.src += '&autoplay=1';
        }
        
        function previousLesson() {
            if (currentLessonIndex > 0) {
                loadLesson(currentLessonIndex - 1);
            }
        }
        
        function nextLesson() {
            // Mark current lesson as completed
            const currentLesson = currentCourse.lessons[currentLessonIndex];
            if (!completedLessons.includes(currentLesson.id)) {
                completedLessons.push(currentLesson.id);
                saveLessonProgress();
            }
            
            if (currentLessonIndex < currentCourse.lessons.length - 1) {
                loadLesson(currentLessonIndex + 1);
                renderLessonsList();
                updateProgress();
                showToast('🎉 Lesson completed! Keep going!');
            }
        }
        
        function goToQuiz() {
            // Mark last lesson as completed
            const currentLesson = currentCourse.lessons[currentLessonIndex];
            if (!completedLessons.includes(currentLesson.id)) {
                completedLessons.push(currentLesson.id);
                saveLessonProgress();
            }
            
            showToast('🏆 All lessons complete! Starting quiz...');
            setTimeout(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const courseId = urlParams.get('course') || 'dyslexia_101';
                window.location.href = `quiz.html?course=${courseId}`;
            }, 1500);
        }
        
        function saveLessonProgress() {
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course') || 'dyslexia_101';
            localStorage.setItem(`course_${courseId}_completed`, JSON.stringify(completedLessons));
        }
        
        function updateProgress() {
            const progress = Math.round((completedLessons.length / currentCourse.lessons.length) * 100);
            document.getElementById('course-progress').style.width = `${progress}%`;
            document.getElementById('progress-text').textContent = `${progress}%`;
        }
        
        function setupPractice(practice) {
            const section = document.getElementById('practice-section');
            const prompt = document.getElementById('practice-prompt');
            const content = document.getElementById('practice-content');
            
            if (practice.type === 'quiz') {
                section.style.display = 'block';
                prompt.textContent = practice.prompt;
                content.innerHTML = `
                    <button onclick="goToQuiz()" style="background: white; color: #EC4899; padding: 15px 30px; border: none; border-radius: 30px; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 15px;">
                        Start Quiz 🚀
                    </button>
                `;
            } else if (practice.options) {
                section.style.display = 'block';
                prompt.textContent = practice.prompt;
                
                let optionsHTML = '<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px;">';
                practice.options.forEach((opt, i) => {
                    optionsHTML += `
                        <button onclick="checkPractice(${i}, ${practice.correct})" 
                                style="background: rgba(255,255,255,0.2); color: white; padding: 12px 24px; border: 2px solid rgba(255,255,255,0.3); border-radius: 25px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;"
                                onmouseover="this.style.background='rgba(255,255,255,0.3)'"
                                onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                            ${opt}
                        </button>
                    `;
                });
                optionsHTML += '</div>';
                content.innerHTML = optionsHTML;
            } else {
                section.style.display = 'none';
            }
        }
        
        function checkPractice(selected, correct) {
            const buttons = document.querySelectorAll('#practice-content button');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === correct) {
                    btn.style.background = '#10B981';
                    btn.style.borderColor = '#10B981';
                } else if (i === selected && selected !== correct) {
                    btn.style.background = '#EF4444';
                    btn.style.borderColor = '#EF4444';
                }
            });
            
            if (selected === correct) {
                showToast('🎉 Correct! Great job!');
            } else {
                showToast('Not quite - try again next time!');
            }
        }
        
        // Assistive functions
        function speakLesson() {
            const content = document.getElementById('lesson-content').textContent;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(content);
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
                showToast('🔊 Reading lesson aloud...');
            }
        }
        
        function toggleDyslexiaFont() {
            document.body.classList.toggle('dyslexia-mode');
            showToast('👁️ Dyslexia-friendly font toggled');
        }
        
        function increaseFontSize() {
            const content = document.querySelector('.lesson-text');
            const currentSize = parseFloat(getComputedStyle(content).fontSize);
            content.style.fontSize = (currentSize + 2) + 'px';
            showToast('A+ Text size increased');
        }
        
        // Toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            toast.style.animation = 'toastIn 0.3s ease forwards';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
