<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard - Accessible Learn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ACCESSIBILITY TOOLBAR -->
    <aside class="a11y-toolbar">
        <button id="a11y-theme" class="a11y-btn">🌗 Theme</button>
        <button id="a11y-font" class="a11y-btn">Aa Font</button>
        <button id="a11y-size-up" class="a11y-btn">A+</button>
        <button id="a11y-size-down" class="a11y-btn">A-</button>
    </aside>

    <header style="background-color: var(--surface-color); padding: 15px 0; border-bottom: 1px solid var(--border-color);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="color: var(--primary-color);">Parent Portal</h2>
            <nav>
                <span>Welcome, <strong>Mr. Parent</strong></span>
                <a href="index.html" class="btn btn-outline" style="margin-left: 15px; padding: 5px 15px; font-size: 0.9rem;">Log Out</a>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        
        <h1>Child Progress Monitoring</h1>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
            
            <!-- Child Profile Card -->
            <div class="card">
                <h3>Linked Student: Alex</h3>
                <p><strong>Current Level:</strong> Beginner</p>
                <p><strong>Last Active:</strong> Today, 10:30 AM</p>
                <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border-color);">
                <button class="btn btn-outline" style="width: 100%;">View Full Profile</button>
            </div>

            <!-- Recent Activity -->
            <div class="card">
                <h3>Recent Activity Log</h3>
                <ul id="activity-list" style="padding-left: 20px; line-height: 1.8;">
                    <li>Loading activity...</li>
                </ul>
            </div>

        </div>

        <!-- Detailed Reports -->
        <h2 style="margin-top: 40px;">Weekly Performance</h2>
        <div class="card">
            <!-- Simple Mock Chart (Static for now, but contextual) -->
            <div style="display: flex; align-items: flex-end; height: 150px; gap: 20px; padding-top: 20px;">
                <div style="background: var(--primary-color); width: 40px; height: 60%; border-radius: 4px 4px 0 0;" title="Mon"></div>
                <div style="background: var(--primary-color); width: 40px; height: 80%; border-radius: 4px 4px 0 0;" title="Tue"></div>
                <div style="background: var(--secondary-color); width: 40px; height: 40%; border-radius: 4px 4px 0 0;" title="Wed"></div>
                <div style="background: var(--primary-color); width: 40px; height: 90%; border-radius: 4px 4px 0 0;" title="Thu"></div>
                <div style="background: var(--primary-color); width: 40px; height: 75%; border-radius: 4px 4px 0 0;" title="Fri"></div>
            </div>
            <div style="display: flex; gap: 20px; margin-top: 10px; font-size: 0.8rem; color: var(--text-muted);">
                <span style="width: 40px; text-align: center;">Mon</span>
                <span style="width: 40px; text-align: center;">Tue</span>
                <span style="width: 40px; text-align: center;">Wed</span>
                <span style="width: 40px; text-align: center;">Thu</span>
                <span style="width: 40px; text-align: center;">Fri</span>
            </div>
        </div>

    </main>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = MockBackend.getCurrentUser();
            const list = document.getElementById('activity-list');
            list.innerHTML = '';

            if(user.recentActivity.length === 0) {
                list.innerHTML = '<li>No recent activity recorded.</li>';
                return;
            }

            // Show last 5 activities
            user.recentActivity.slice(0, 5).forEach(act => {
                list.innerHTML += `<li>${act.text} <span style="font-size:0.8em; color:#999;">(${act.time})</span></li>`;
            });
        });
    </script>
</body>
</html>
