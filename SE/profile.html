<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Accessible Learn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ACCESSIBILITY TOOLBAR -->
    <aside class="a11y-toolbar">
        <button id="a11y-theme" class="a11y-btn">🌗 Theme</button>
        <button id="a11y-font" class="a11y-btn">Aa Font</button>
        <button id="a11y-size-up" class="a11y-btn">A+</button>
        <button id="a11y-size-down" class="a11y-btn">A-</button>
    </aside>

    <header style="background-color: var(--surface-color); padding: 15px 0; border-bottom: 1px solid var(--border-color);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="dashboard.html" class="btn btn-outline">&larr; Back to Dashboard</a>
            <h2>My Profile</h2>
            <div></div>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 30px;">
            
            <!-- Personal Details -->
            <div class="card">
                <h3>Personal Details</h3>
                <form onsubmit="event.preventDefault(); alert('Profile Updated!');">
                    <div style="margin-bottom: 15px;">
                        <label>Display Name</label>
                        <input type="text" value="Student" style="width: 100%; padding: 8px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label>Email</label>
                        <input type="email" value="student@example.com" style="width: 100%; padding: 8px;">
                    </div>
                    <button class="btn btn-primary">Save Changes</button>
                </form>
            </div>

            <!-- Accessibility Settings (Detailed) -->
            <div class="card">
                <h3>Learning Preferences</h3>
                <p style="margin-bottom: 20px;">Customize your learning experience.</p>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Color Theme</label>
                    <select id="pref-theme" style="padding: 8px; width: 100%;" onchange="document.documentElement.setAttribute('data-theme', this.value); localStorage.setItem('siteTheme', this.value);">
                        <option value="light">Light (Standard)</option>
                        <option value="dark">Dark (Low Light)</option>
                        <option value="high-contrast">High Contrast (Vision Impaired)</option>
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Font Style</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="checkbox" id="pref-dyslexic" onchange="toggleDyslexiaFont()">
                        <label for="pref-dyslexic">Use Dyslexia-Friendly Font (OpenDyslexic)</label>
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Text-to-Speech Speed</label>
                    <input type="range" min="0.5" max="2" step="0.1" value="1" style="width: 100%;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                        <span>Slow</span>
                        <span>Normal</span>
                        <span>Fast</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
