<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Module 1</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            text-align: left;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background-color: var(--background-color);
            border-color: var(--primary-color);
        }
        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
    </style>
</head>
<body>

    <!-- ACCESSIBILITY TOOLBAR -->
    <aside class="a11y-toolbar">
        <button id="a11y-theme" class="a11y-btn">🌗 Theme</button>
        <button id="a11y-font" class="a11y-btn">Aa Font</button>
        <button id="a11y-size-up" class="a11y-btn">A+</button>
        <button id="a11y-size-down" class="a11y-btn">A-</button>
    </aside>

    <header style="background-color: var(--surface-color); padding: 15px 0; border-bottom: 1px solid var(--border-color);">
        <div class="container">
            <a href="dashboard.html" class="btn btn-outline">&larr; Quit Quiz</a>
        </div>
    </header>

    <main class="container" style="max-width: 800px; margin-top: 40px;">
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <span style="font-weight: bold; color: var(--primary-color);">Question 1 of 3</span>
                <span>Score: <span id="score">0</span></span>
            </div>

            <h2 id="question-text" style="font-size: 1.5rem; margin-bottom: 30px;">
                <span id="loading-indicator">✨ AI is generating your quiz question...</span>
            </h2>

            <div id="options-container" style="display: none;">
                <!-- Options will be injected here -->
            </div>

            <div id="feedback" style="margin-top: 20px; font-weight: bold; min-height: 1.5rem;"></div>

            <button class="btn btn-primary" style="margin-top: 20px; display: none;" id="next-btn" onclick="nextQuestion()">Finish Quiz &rarr;</button>
        </div>

    </main>

    <script src="script.js"></script>
    <script>
        let currentScore = 0;
        let correctAnswerIndex = 0;
        let currentExplanation = "";
        const QUIZ_TOPIC = "English Greetings"; 

        // Load Question on Init
        document.addEventListener('DOMContentLoaded', async () => {
             const questionData = await GeminiService.generateQuizQuestion(QUIZ_TOPIC);
             renderQuestion(questionData);
        });

        function renderQuestion(data) {
            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('options-container').style.display = 'block';
            
            document.getElementById('question-text').innerText = data.question;
            correctAnswerIndex = data.correctIndex;
            currentExplanation = data.explanation;

            const container = document.getElementById('options-container');
            container.innerHTML = ''; // Clear old

            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                // Add A) B) C) prefixes
                const prefix = String.fromCharCode(65 + index); 
                btn.innerText = `${prefix}) ${opt}`;
                btn.onclick = () => checkAnswer(btn, index === correctAnswerIndex);
                container.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            // Disable all buttons
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = `Correct! Well done.<br><span style="font-weight:normal; color:#555;">${currentExplanation}</span>`;
                document.getElementById('feedback').style.color = "green";
                currentScore = 100;
                document.getElementById('score').innerText = currentScore;
                showToast("Correct Answer!");
            } else {
                btn.classList.add('wrong');
                // Find correct button to highlight it
                buttons[correctAnswerIndex].classList.add('correct');
                
                document.getElementById('feedback').innerHTML = `Incorrect.<br><span style="font-weight:normal; color:#555;">${currentExplanation}</span>`;
                document.getElementById('feedback').style.color = "red";
                showToast("Incorrect.");
            }

            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            // Submit Score to Backend
            MockBackend.submitQuiz(`AI Quiz: ${QUIZ_TOPIC}`, currentScore);
            
            // Also update course progress if they passed
            if (currentScore > 50) {
                MockBackend.updateProgress('course_101', 100);
            }

            alert(`Quiz Complete! Score: ${currentScore}%\nResult saved to your profile.`);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
